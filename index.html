<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClimbAlong - Screenpublishing-Timer</title>
    <style>
        body {
            color: #fff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background-color: #333;
            transition: background-color 0.2s ease;
        }
        #timer-display {
            font-size: 35vw;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            line-height: 0.8;
            margin: 0;
        }
        #phase-header {
            font-size: 6vw;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }
        #version-tag {
            position: fixed;
            bottom: 15px;
            font-size: 14px;
            color: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>

    <div id="phase-header">KLAR</div>
    <div id="timer-display">00:30</div>
    <div id="version-tag">Versjon: v0.8 (Screenpublishing-Native)</div>

    <script>
        const body = document.body;
        const display = document.getElementById('timer-display');
        const phaseHeader = document.getElementById('phase-header');

        let timeLeft = 30;
        let phase = 'prep';
        let timerInterval = null;

        // Sjekk hva URL-en slutter på (?status=...)
        const urlParams = new URLSearchParams(window.location.search);
        const status = urlParams.get('status');

        if (status === 'start') {
            // Hvis URL-en slutter på ?status=start, starter nedtellingen automatisk med en gang siden lastes inn!
            phase = 'prep';
            timeLeft = 30;
            body.style.backgroundColor = "#f44336"; // Rød
            phaseHeader.innerText = "Klargjøring (30s)";
            
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    let mins = Math.floor(timeLeft / 60);
                    let secs = timeLeft % 60;
                    display.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                } else {
                    if (phase === 'prep') {
                        phase = 'climb';
                        timeLeft = 300; // 5 minutter klatring
                        body.style.backgroundColor = "#4caf50"; // Grønn
                        phaseHeader.innerText = "Klatring (5 min)";
                    } else {
                        // Automatisk loop: Tilbake til klargjøring
                        phase = 'prep';
                        timeLeft = 30;
                        body.style.backgroundColor = "#f44336";
                        phaseHeader.innerText = "Klargjøring (30s)";
                    }
                }
            }, 1000);

        } else if (status === 'stopp') {
            // Vis en frossen rød skjerm på 00:30 (Pause/Stopp)
            body.style.backgroundColor = "#f44336";
            phaseHeader.innerText = "Klargjøring (Stoppet)";
            display.innerText = "00:30";
        } else {
            // Standardvisning hvis man bare åpner siden vanlig
            body.style.backgroundColor = "#555";
            phaseHeader.innerText = "KLAR TIL START";
            display.innerText = "00:30";
        }
    </script>
</body>
</html>
