<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClimbAlong - Onsite Auto-Timer (P2P)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            color: #fff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background-color: #f44336;
            transition: background-color 0.2s ease;
        }
        #timer-display {
            font-size: 35vw;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            line-height: 0.8;
            margin: 0;
        }
        #phase-header {
            font-size: 6vw;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }
        #admin-panel {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            padding: 15px 25px;
            border-radius: 12px;
            z-index: 9999;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        button {
            font-size: 20px;
            padding: 12px 25px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            font-weight: bold;
        }
        input {
            font-size: 16px;
            padding: 10px;
            border-radius: 6px;
            border: none;
            margin-right: 5px;
            width: 150px;
            text-align: center;
        }
        #p2p-info {
            font-size: 14px;
            color: #1cf;
            margin-bottom: 8px;
            font-weight: bold;
        }
        #version-tag {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div id="phase-header">Klargjøring (30s)</div>
    <div id="timer-display">00:30</div>

    <div id="admin-panel">
        <div id="p2p-info">Genererer din skjerm-ID...</div>
        
        <div id="connect-row" style="margin-bottom: 10px;">
            <input type="text" id="peer-id-input" placeholder="Tast inn TV-ens ID">
            <button id="btn-connect" style="background:#2196f3; color:white; font-size:16px; padding:10px 15px;">Koble til TV</button>
        </div>

        <button id="btn-start" style="background:#4caf50; color:white">START</button>
        <button id="btn-stop" style="background:#e91e63; color:white">STOPP</button>
        <button id="btn-reset" style="background:#ff9800; color:white">RESET</button>
        
        <div id="version-tag">Versjon: v0.3 (P2P-Tunnel)</div>
    </div>

    <script>
        let timeLeft = 30; 
        let phase = 'prep'; 
        let isRunning = false;
        let timerInterval = null;
        
        // P2P Variabler
        let peer = null;
        let conn = null;

        const body = document.body;
        const display = document.getElementById('timer-display');
        const phaseHeader = document.getElementById('phase-header');
        const p2pInfo = document.getElementById('p2p-info');

        // Lydfunksjon
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(frequency, duration) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const oscillator = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime); 
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                oscillator.connect(gain); gain.connect(audioCtx.destination);
                oscillator.start(); oscillator.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function updateUI() {
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            display.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            body.style.backgroundColor = (phase === 'prep') ? "#f44336" : "#4caf50";
            phaseHeader.innerText = (phase === 'prep') ? "Klargjøring (30s)" : "Klatring (5 min)";
        }

        function tick() {
            if (!isRunning) return;
            if (timeLeft > 0) {
                timeLeft--; 
                updateUI();
            } else {
                if (phase === 'prep') {
                    playBeep(880, 0.5); 
                    phase = 'climb'; timeLeft = 300; 
                } else {
                    playBeep(440, 1.0); 
                    phase = 'prep'; timeLeft = 30; 
                }
                updateUI();
            }
        }

        function localStart() { isRunning = true; if (!timerInterval) timerInterval = setInterval(tick, 1000); }
        function localStop() { isRunning = false; clearInterval(timerInterval); timerInterval = null; }
        function localReset() { isRunning = false; clearInterval(timerInterval); timerInterval = null; phase = 'prep'; timeLeft = 30; updateUI(); }

        // --- OPPSETT AV DIREKTE P2P-TUNNEL ---
        // Generer en tilfeldig ID for denne spesifikke skjermen mellom 100 og 999
        const myId = "klatre-" + Math.floor(100 + Math.random() * 900);
        
        peer = new Peer(myId);

        peer.on('open', (id) => {
            p2pInfo.innerText = "Denne skjermens ID: " + id;
        });

        // Hva skjer når denne enheten (f.eks TV-en) mottar en tilkobling fra kontroll-PC?
        peer.on('connection', (incomingConn) => {
            conn = incomingConn;
            setupDataListener();
            p2pInfo.innerText = "Status: Fjernstyrt av PC! 🟢";
            document.getElementById('connect-row').style.display = 'none'; // Gjem koblingsfeltet på TV-en
        });

        // Lytt etter start/stopp-ordrer gjennom tunnelen
        function setupDataListener() {
            conn.on('data', (data) => {
                if (data === 'start') localStart();
                if (data === 'stop') localStop();
                if (data === 'reset') localReset();
            });
            conn.on('close', () => {
                p2pInfo.innerText = "Mistet kobling. ID: " + myId;
            });
        }

        // Knapp: Koble fra kontroll-PC til TV-skjermen
        document.getElementById('btn-connect').onclick = () => {
            const targetId = document.getElementById('peer-id-input').value.trim();
            if (targetId) {
                p2pInfo.innerText = "Kobler til " + targetId + "...";
                conn = peer.connect(targetId);
                
                conn.on('open', () => {
                    p2pInfo.innerText = "Tilkoblet TV! Du styrer nå storskjermen. 🚀";
                });
                
                setupDataListener();
            }
        };

        // Send kommando gjennom tunnelen, OG kjør lokalt
        function sendCommand(actionName) {
            if (actionName === 'start') localStart();
            if (actionName === 'stop') localStop();
            if (actionName === 'reset') localReset();

            if (conn && conn.open) {
                conn.send(actionName);
            }
        }

        document.getElementById('btn-start').onclick = () => sendCommand('start');
        document.getElementById('btn-stop').onclick = () => sendCommand('stop');
        document.getElementById('btn-reset').onclick = () => sendCommand('reset');

        updateUI(); 
    </script>
</body>
</html>
