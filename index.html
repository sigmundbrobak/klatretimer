<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClimbAlong - Onsite Auto-Timer (PieSocket)</title>
    <style>
        body {
            color: #fff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background-color: #f44336; /* Rød standard */
            transition: background-color 0.2s ease;
        }
        #timer-display {
            font-size: 35vw;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            line-height: 0.8;
            margin: 0;
        }
        #phase-header {
            font-size: 6vw;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }
        #admin-panel {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 12px;
            z-index: 9999;
            text-align: center;
        }
        button {
            font-size: 24px;
            padding: 15px 35px;
            margin: 0 10px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            font-weight: bold;
        }
        #version-tag {
            font-size: 14px;
            color: #aaa;
            margin-top: 10px;
            display: block;
        }
    </style>
</head>
<body>

    <div id="phase-header">Klargjøring (30s)</div>
    <div id="timer-display">00:30</div>

    <div id="admin-panel">
        <button id="btn-start" style="background:#4caf50; color:white">START</button>
        <button id="btn-stop" style="background:#2196f3; color:white">STOPP</button>
        <button id="btn-reset" style="background:#ff9800; color:white">RESET</button>
        <div id="version-tag">Versjon: v0.2</div>
    </div>

    <script>
        let timeLeft = 30; 
        let phase = 'prep'; 
        let isRunning = false;
        let timerInterval = null;
        let ws = null;

        const body = document.body;
        const display = document.getElementById('timer-display');
        const phaseHeader = document.getElementById('phase-header');

        // Lydfunksjon
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(frequency, duration) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const oscillator = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime); 
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                oscillator.connect(gain); gain.connect(audioCtx.destination);
                oscillator.start(); oscillator.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function updateUI() {
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            display.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            body.style.backgroundColor = (phase === 'prep') ? "#f44336" : "#4caf50";
            phaseHeader.innerText = (phase === 'prep') ? "Klargjøring (30s)" : "Klatring (5 min)";
        }

        function tick() {
            if (!isRunning) return;
            if (timeLeft > 0) {
                timeLeft--; 
                updateUI();
            } else {
                if (phase === 'prep') {
                    playBeep(880, 0.5); 
                    phase = 'climb'; 
                    timeLeft = 300; 
                } else {
                    playBeep(440, 1.0); 
                    phase = 'prep'; 
                    timeLeft = 30; 
                }
                updateUI();
            }
        }

        function localStart() { isRunning = true; if (!timerInterval) timerInterval = setInterval(tick, 1000); }
        function localStop() { isRunning = false; clearInterval(timerInterval); timerInterval = null; }
        function localReset() { isRunning = false; clearInterval(timerInterval); timerInterval = null; phase = 'prep'; timeLeft = 30; updateUI(); }

        // --- SKUDDSIKKER WEBSOCKET-TUNNEL (PieSocket) ---
        // Denne oppretter en direkte linje mellom nettleserne dine uten omveier
        function connectWebSocket() {
            ws = new WebSocket("wss://demo.piesocket.com/v3/klatretimer_channel_2026?api_key=o7ee7ndv6McY9LkQAUnWS96fK89vH4bSAs3UctmX&notify_self=1");

            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    if (data.action === 'start') localStart();
                    if (data.action === 'stop') localStop();
                    if (data.action === 'reset') localReset();
                } catch(e) {}
            };

            // Hvis linjen faller ut, kobler den seg automatisk på igjen
            ws.onclose = function() {
                setTimeout(connectWebSocket, 2000);
            };
        }

        connectWebSocket();

        // Sender kommandoen direkte inn i WebSocket-tunnelen
        function sendCommand(actionName) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: actionName }));
            } else {
                // Kriseløsning: Hvis nettet er nede, kjør i hvert fall lokalt
                if (actionName === 'start') localStart();
                if (actionName === 'stop') localStop();
                if (actionName === 'reset') localReset();
            }
        }

        document.getElementById('btn-start').onclick = () => sendCommand('start');
        document.getElementById('btn-stop').onclick = () => sendCommand('stop');
        document.getElementById('btn-reset').onclick = () => sendCommand('reset');

        updateUI(); 
    </script>
</body>
</html>
