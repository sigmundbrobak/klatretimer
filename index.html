<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClimbAlong - Onsite Auto-Timer (TimeSync)</title>
    <style>
        body {
            color: #fff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background-color: #f44336;
            transition: background-color 0.2s ease;
        }
        #timer-display {
            font-size: 35vw;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            line-height: 0.8;
            margin: 0;
        }
        #phase-header {
            font-size: 6vw;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }
        #admin-panel {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            padding: 15px 25px;
            border-radius: 12px;
            z-index: 9999;
            text-align: center;
        }
        button {
            font-size: 20px;
            padding: 12px 25px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            font-weight: bold;
        }
        #version-tag {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div id="phase-header">Klargjøring (30s)</div>
    <div id="timer-display">00:30</div>

    <div id="admin-panel">
        <button id="btn-start" style="background:#4caf50; color:white">START TIMERE</button>
        <button id="btn-reset" style="background:#ff9800; color:white">RESET ALL</button>
        <div id="version-tag">Versjon: v0.4 (TimeSync)</div>
    </div>

    <script>
        let startTime = 0; // Tidspunktet i millisekunder da start ble trykket
        let timerInterval = null;

        const body = document.body;
        const display = document.getElementById('timer-display');
        const phaseHeader = document.getElementById('phase-header');

        // Lydfunksjon
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let lastBeepTime = 0;
        function playBeep(frequency, duration) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const oscillator = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime); 
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                oscillator.connect(gain); gain.connect(audioCtx.destination);
                oscillator.start(); oscillator.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        // Hovedlogikk: Regner ut nøyaktig tid basert på felles servertid
        function calculateTime() {
            if (startTime === 0) {
                // Timeren er ikke startet eller er resatt
                display.innerText = "00:30";
                body.style.backgroundColor = "#f44336";
                phaseHeader.innerText = "Klargjøring (30s)";
                return;
            }

            const now = Date.now();
            const elapsedSeconds = Math.floor((now - startTime) / 1000);
            
            if (elapsedSeconds < 0) {
                display.innerText = "00:30";
                return;
            }

            const totalLoopTime = 330; // 30s prep + 300s klatring = 330 sekunder totalt per runde
            const currentLoopSeconds = elapsedSeconds % totalLoopTime;

            if (currentLoopSeconds < 30) {
                // Vi er i klargjøringsfasen (de første 30 sekundene av loopen)
                const timeLeft = 30 - currentLoopSeconds;
                let mins = Math.floor(timeLeft / 60);
                let secs = timeLeft % 60;
                display.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                body.style.backgroundColor = "#f44336";
                phaseHeader.innerText = "Klargjøring (30s)";
                
                // Pip rett før start (på sekund 0 av den nye klatringen)
                if (timeLeft === 1 && now - lastBeepTime > 2000) {
                    playBeep(880, 0.5);
                    lastBeepTime = now;
                }
            } else {
                // Vi er i klatrefasen (de neste 300 sekundene av loopen)
                const timeLeft = 330 - currentLoopSeconds;
                let mins = Math.floor(timeLeft / 60);
                let secs = timeLeft % 60;
                display.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                body.style.backgroundColor = "#4caf50";
                phaseHeader.innerText = "Klatring (5 min)";

                // Pip når klatringen er ferdig
                if (timeLeft === 1 && now - lastBeepTime > 2000) {
                    playBeep(440, 1.0);
                    lastBeepTime = now;
                }
            }
        }

        // --- DIREKTE SYNKRONISERING VIA BILDETRIKS (Garantert ublokkerbart) ---
        function checkServer() {
            // Vi henter den lagrede start-tiden fra en helt åpen ntfy-logg (som ren JSON-tekst)
            fetch(`https://ntfy.sh/climbalong_timesync_2026/json?poll=1&limit=1&t=` + Date.now())
            .then(res => res.json())
            .then(data => {
                if (data && data.length > 0) {
                    const msg = data[0].message;
                    if (msg === 'reset') {
                        startTime = 0;
                    } else {
                        startTime = parseInt(msg);
                    }
                }
            }).catch(e => {});
        }

        // TV-ene sjekker skyen hvert sekund
        setInterval(checkServer, 1000);
        // UI oppdateres lynraskt lokalt på skjermen
        setInterval(calculateTime, 200);

        // --- ADMIN-KNAPPER ---
        function sendStart() {
            const currentServerTime = Date.now();
            // Vi sender tidspunktet vi startet til skyen via et ublokkerbart bilde-kall
            const img = new Image();
            img.src = `https://ntfy.sh/climbalong_timesync_2026/publish?message=${currentServerTime}&t=${Date.now()}`;
            startTime = currentServerTime;
        }

        function sendReset() {
            const img = new Image();
            img.src = `https://ntfy.sh/climbalong_timesync_2026/publish?message=reset&t=${Date.now()}`;
            startTime = 0;
        }

        document.getElementById('btn-start').onclick = () => sendStart();
        document.getElementById('btn-reset').onclick = () => sendReset();
    </script>
</body>
</html>
