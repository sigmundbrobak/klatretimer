<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClimbAlong - Onsite Auto-Timer (WallClock)</title>
    <style>
        body {
            color: #fff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background-color: #f44336;
            transition: background-color 0.2s ease;
        }
        #timer-display {
            font-size: 35vw;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            line-height: 0.8;
            margin: 0;
        }
        #phase-header {
            font-size: 6vw;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }
        #version-tag {
            position: fixed;
            bottom: 20px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

    <div id="phase-header">Klargjøring (30s)</div>
    <div id="timer-display">00:30</div>
    <div id="version-tag">Versjon: v0.5 (Autopilot)</div>

    <script>
        const body = document.body;
        const display = document.getElementById('timer-display');
        const phaseHeader = document.getElementById('phase-header');

        // Lydfunksjon
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let lastBeepRound = -1;

        function playBeep(frequency, duration) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const oscillator = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime); 
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                oscillator.connect(gain); gain.connect(audioCtx.destination);
                oscillator.start(); oscillator.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function updateTimer() {
            // 1. Hent nøyaktig antall sekunder siden midnatt i dag basert på lokal klokke
            const now = new Date();
            const totalSecondsToday = (now.getHours() * 3600) + (now.getMinutes() * 60) + now.getSeconds();
            
            // 2. En hel runde varer i 330 sekunder (30s klargjøring + 300s klatring)
            const ROUND_DURATION = 330; 
            const currentRoundNumber = Math.floor(totalSecondsToday / ROUND_DURATION);
            const secondsIntoCurrentRound = totalSecondsToday % ROUND_DURATION;

            // 3. Sjekk om vi er i klargjøring (første 30 sekunder) eller klatring (neste 300 sekunder)
            if (secondsIntoCurrentRound < 30) {
                // KLARGJØRING
                const timeLeft = 30 - secondsIntoCurrentRound;
                let mins = Math.floor(timeLeft / 60);
                let secs = timeLeft % 60;
                display.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                body.style.backgroundColor = "#f44336"; // Rød
                phaseHeader.innerText = "Klargjøring (30s)";
                
                // Pip akkurat i det vi går over til klatring (når 1 sekund gjenstår av prep)
                if (timeLeft === 1 && lastBeepRound !== currentRoundNumber + "_prep") {
                    playBeep(880, 0.5);
                    lastBeepRound = currentRoundNumber + "_prep";
                }
            } else {
                // KLATRING
                const timeLeft = ROUND_DURATION - secondsIntoCurrentRound;
                let mins = Math.floor(timeLeft / 60);
                let secs = timeLeft % 60;
                display.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                body.style.backgroundColor = "#4caf50"; // Grønn
                phaseHeader.innerText = "Klatring (5 min)";

                // Pip akkurat når klatringen er ferdig (når 1 sekund gjenstår)
                if (timeLeft === 1 && lastBeepRound !== currentRoundNumber + "_climb") {
                    playBeep(440, 1.0);
                    lastBeepRound = currentRoundNumber + "_climb";
                }
            }
        }

        // Oppdater klokkesjekken 5 ganger i sekundet så den er 100% nøyaktig
        setInterval(updateTimer, 200);
        updateTimer();
    </script>
</body>
</html>
