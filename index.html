<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klatretimer Skysynk</title>
    <style>
        body {
            color: #fff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background-color: #f44336;
            transition: background-color 0.3s ease;
        }
        #timer-display {
            font-size: 35vw;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            line-height: 0.8;
            margin: 0;
        }
        #phase-header {
            font-size: 6vw;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }
        #admin-panel {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            z-index: 9999;
            text-align: center;
        }
        button {
            font-size: 24px;
            padding: 15px 30px;
            margin: 5px 10px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            font-weight: bold;
        }
        #status {
            font-size: 14px;
            color: #aaa;
            margin-top: 5px;
        }
        #version-tag {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div id="phase-header">Klargjøring (30s)</div>
    <div id="timer-display">00:30</div>

    <div id="admin-panel">
        <button id="btn-start" style="background:#4caf50; color:white">START</button>
        <button id="btn-stop" style="background:#2196f3; color:white">STOPP</button>
        <button id="btn-reset" style="background:#ff9800; color:white">RESET</button>
        <div id="status">Kobler til synkronisering...</div>
        <div id="version-tag">Versjon: v1.0 (Auto-loop)</div>
    </div>

    <script>
        let timeLeft = 30; 
        let phase = 'prep'; 
        let isRunning = false;
        let timerInterval = null;

        const body = document.body;
        const display = document.getElementById('timer-display');
        const phaseHeader = document.getElementById('phase-header');
        const statusDiv = document.getElementById('status');

        // Lydfunksjon
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(frequency, duration) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime); 
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                oscillator.connect(gainNode); gainNode.connect(audioCtx.destination);
                oscillator.start(); oscillator.stop(audioCtx.currentTime + duration);
            } catch(e) { console.log("Lydblokkert:", e); }
        }

        function updateUI() {
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            display.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            body.style.backgroundColor = (phase === 'prep') ? "#f44336" : "#4caf50";
            phaseHeader.innerText = (phase === 'prep') ? "Klargjøring (30s)" : "Klatring (5 min)";
        }

        function tick() {
            if (!isRunning) return;
            if (timeLeft > 0) {
                timeLeft--; 
                updateUI();
            } else {
                if (phase === 'prep') {
                    // Klargjøring ferdig -> Start klatring
                    playBeep(880, 0.5); 
                    phase = 'climb'; 
                    timeLeft = 300; 
                } else {
                    // Klatring ferdig -> Gå automatisk tilbake til klargjøring!
                    playBeep(440, 1.0); 
                    phase = 'prep'; 
                    timeLeft = 30; 
                }
                updateUI();
            }
        }

        function localStart() { isRunning = true; if (!timerInterval) timerInterval = setInterval(tick, 1000); }
        function localStop() { isRunning = false; clearInterval(timerInterval); timerInterval = null; }
        function localReset() { isRunning = false; clearInterval(timerInterval); timerInterval = null; phase = 'prep'; timeLeft = 30; updateUI(); }

        // --- SKYSYNKRONISERING VIA NTFY ---
        const TOPIC = "klatretimer_onsite_klubb_2026"; 
        const eventSource = new EventSource(`https://ntfy.sh/${TOPIC}/sse`);
        
        eventSource.onopen = () => {
            statusDiv.innerText = "Tilkoblet skyen! Synkronisering aktiv.";
        };
        
        eventSource.onerror = () => {
            statusDiv.innerText = "Gjenoppretter forbindelse...";
        };

        eventSource.onmessage = (event) => {
            try {
                const eventData = JSON.parse(event.data);
                const action = eventData.message;
                if (action === 'start') localStart();
                if (action === 'stop') localStop();
                if (action === 'reset') localReset();
            } catch(e) { }
        };

        function sendCommand(actionName) {
            fetch(`https://ntfy.sh/${TOPIC}`, {
                method: 'POST',
                body: actionName
            }).catch(e => console.error("Kunne ikke sende:", e));
        }

        document.getElementById('btn-start').onclick = () => sendCommand('start');
        document.getElementById('btn-stop').onclick = () => sendCommand('stop');
        document.getElementById('btn-reset').onclick = () => sendCommand('reset');

        updateUI(); 
    </script>
</body>
</html>
